name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned wtc release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat .wtc-cli-version)"
          case "$(uname -s)" in Darwin) os=darwin ;; Linux) os=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          asset="wtc_${version}_${os}_${arch}.tar.gz"
          gh release download "v${version}" -R lcorneliussen/wtc-cli -p "$asset" -p checksums.txt
          grep "  ${asset}$" checksums.txt | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/wtc-bin"
          tar -xzf "$asset" -C "$RUNNER_TEMP/wtc-bin" wtc
          echo "$RUNNER_TEMP/wtc-bin" >> "$GITHUB_PATH"
      - name: Check native reference and agent hooks
        run: |
          python3 tests/native_reference_test.py
          python3 tests/agent_hook_test.py
          python3 tests/publication_guard_test.py
