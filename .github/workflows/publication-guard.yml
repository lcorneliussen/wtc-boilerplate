name: publication guard
run-name: Publication guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to inspect
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always run trusted default-branch code, including for fork PR events.
      # No PR checkout, dependencies, artifacts, caches or contributor scripts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Inspect publication data
        env:
          PUBLICATION_FORBIDDEN_TERMS: ${{ secrets.PUBLICATION_FORBIDDEN_TERMS }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/publication-guard.py
